name: CI

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  performance:
    name: Performance budgets and profiles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
          cache: npm
      - run: npm ci
      - run: npm run bench:test
      - run: npm run profile
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/performance/receipt.json
            reports/profiling/
          if-no-files-found: error
          retention-days: 30

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
          cache: npm

      - name: Engines Check
        run: node scripts/engines-check.js

      - name: Install
        run: npm ci

      - name: CI Contract Policy
        run: npm run ci:policy

      - name: Biome (Lint & Format)
        run: npm run ci

      - name: Knip (Dead Code Detection)
        run: npm run knip

      - name: Typecheck
        run: npx tsc --noEmit --pretty false

      - name: Build
        run: npx tsc -p tsconfig.json --incremental

      - name: Test Coverage
        run: npm run test:coverage

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: true
          files: ./coverage/lcov.info
          flags: quality
          name: quality
          # Token or OIDC; do not fail PR Quality on a missing/skipped upload.
          fail_ci_if_error: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      - name: Production Audit
        run: npm run audit:prod

      - name: Secret Pattern Scan
        run: npm run scan:secrets

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
          cache: npm
      - run: npm ci
      - name: Bounded parser, config, and schema fuzz
        env:
          FUZZ_RUNS: "80"
        run: npm run test:fuzz

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
          cache: npm
      - run: npm ci && npm run build
      - run: node dist/cli.js inspect examples/basic.md

  assurance:
    name: Deterministic Assurance Taxonomy
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
          cache: npm
      - run: npm ci
      - name: Validate and run deterministic assurance taxonomy
        run: npm run test:assurance

  mutation:
    name: Mutation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
          cache: npm
      - run: npm ci
      - name: Mutation Test
        run: npm run test:mutation
      - name: Upload Mutation Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: reports/mutation
          archive: true
          if-no-files-found: ignore
          retention-days: 30

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: E2E Tests
        env:
          SUBSTACK_EMAIL: ${{ secrets.SUBSTACK_EMAIL }}
          SUBSTACK_PASSWORD: ${{ secrets.SUBSTACK_PASSWORD }}
          SUBSTACK_PUBLICATION_URL: ${{ secrets.SUBSTACK_PUBLICATION_URL }}
        run: npm run test:e2e
