name: CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Engines Check
        run: node -e "process.exitCode=require('semver').satisfies(process.version.slice(1),require('./package.json').engines.node)?0:1"

      - name: Install
        run: npm ci

      - name: Quality Gate
        run: npm run quality

      - name: Production Audit
        run: npm run audit:prod

      - name: Secret Pattern Scan
        run: npm run scan:secrets

  # Gating: if Stryker's break threshold (currently 50) is breached, Stryker
  # exits non-zero and this job fails, blocking the PR.
  mutation:
    name: Mutation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Mutation Test
        run: npm run test:mutation

      - name: Upload Mutation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation
          if-no-files-found: ignore

  # Manual-only E2E job: requires live Substack credentials and a Chromium
  # browser binary.  Trigger with workflow_dispatch from the Actions tab.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: E2E Tests
        env:
          SUBSTACK_EMAIL: ${{ secrets.SUBSTACK_EMAIL }}
          SUBSTACK_PASSWORD: ${{ secrets.SUBSTACK_PASSWORD }}
          SUBSTACK_PUBLICATION_URL: ${{ secrets.SUBSTACK_PUBLICATION_URL }}
        run: npm run test:e2e
