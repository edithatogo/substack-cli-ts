name: Publish

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and verify release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
          package-manager-cache: false
      - name: Verify trusted-publishing npm support
        run: |
          minimum=11.17.0
          current=$(npm --version)
          test "$(printf '%s\n' "$minimum" "$current" | sort -V | head -n1)" = "$minimum"
      - name: Install exact dependency graph
        run: npm ci --ignore-scripts
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run version:release -- "$RELEASE_TAG"
      - name: Require merged release commit and unused npm version
        run: |
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          package_spec=$(node -p 'const p=require("./package.json"); p.name + "@" + p.version')
          if output=$(npm view "$package_spec" version 2>&1); then
            echo "Release version already exists: $output" >&2
            exit 1
          fi
          if ! grep -q 'E404' <<< "$output"; then
            echo "$output" >&2
            exit 1
          fi
      - name: Run release verification
        run: npm run quality
      - name: Generate SBOM evidence
        run: npm run sbom
      - name: Build exact release artifact
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: npm run release:prepare
      - name: Upload exact release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: |
            reports/release/
            reports/sbom/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Attest and publish exact artifact
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Verify trusted-publishing npm support
        run: |
          minimum=11.17.0
          current=$(npm --version)
          test "$(printf '%s\n' "$minimum" "$current" | sort -V | head -n1)" = "$minimum"
      - name: Download verified release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: reports
      - name: Verify exact artifact checksum
        working-directory: reports/release
        run: sha256sum --check SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: reports/release/*.tgz
      - name: Attest SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: reports/release/*.tgz
          sbom-path: reports/sbom/package.spdx.json
      - name: Publish exact tarball with npm trusted publishing
        run: |
          mapfile -t tarballs < <(find reports/release -maxdepth 1 -type f -name '*.tgz')
          test "${#tarballs[@]}" -eq 1
          npm publish "${tarballs[0]}" --access public
      - name: Create GitHub release from exact evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            reports/release/*.tgz \
            reports/release/SHA256SUMS \
            reports/release/verification-receipt.json \
            reports/sbom/package.spdx.json \
            reports/sbom/package.cdx.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --verify-tag
