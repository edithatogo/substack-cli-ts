name: Disposable Publication Canary

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN DISPOSABLE CANARY
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: disposable-publication-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Guarded disposable publication lifecycle
    environment: disposable-substack-canary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Verify deterministic lifecycle guards
        run: npm run test:disposable-canary:unit
      - name: Run disposable lifecycle
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SUBSTACK_CANARY_CONFIRM: ${{ inputs.confirmation }}
          SUBSTACK_CANARY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          SUBSTACK_DISPOSABLE_PUBLICATION_URL: ${{ vars.SUBSTACK_DISPOSABLE_PUBLICATION_URL }}
          SUBSTACK_CANARY_PRODUCTION_URLS: ${{ vars.SUBSTACK_CANARY_PRODUCTION_URLS }}
          SUBSTACK_DISPOSABLE_CONTRACT_JSON: ${{ vars.SUBSTACK_DISPOSABLE_CONTRACT_JSON }}
          SUBSTACK_TEST_COOKIE: ${{ secrets.SUBSTACK_TEST_COOKIE }}
        run: npm run test:disposable-canary
      - name: Upload redacted cleanup receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: disposable-publication-canary-${{ github.run_id }}
          path: reports/canary/disposable-publication.json
          if-no-files-found: error
          retention-days: 30
