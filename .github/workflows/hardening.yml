name: Hardening

on:
  pull_request:
  push:
    branches: [master, main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strictest-typescript:
    name: Strictest TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck:strictest || echo "Strictest TypeScript advisory failures recorded."

  required-security:
    name: Required Audit And Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:prod
      - run: npm run scan:secrets

  node-compatibility:
    name: Node Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run --configLoader bundle
      - run: node dist/cli.js inspect examples/basic.md

  sbom:
    name: SBOM Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sbom
      - uses: actions/upload-artifact@v7
        with:
          name: package-sbom
          path: reports/sbom/package.spdx.json

  experimental-dependencies:
    name: Experimental Dependency Lane
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        lane:
          - playwright-next
          - stagehand-alpha
          - typescript-rc
          - typescript-next
          - vitest-beta
          - zod-canary
          - prettier-alpha
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/experimental-dependency-lane.mjs ${{ matrix.lane }}

  frontier-drift:
    name: Frontier Drift Monitor
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build drift artifacts
        id: drift
        continue-on-error: true
        run: |
          mkdir -p reports/frontier-drift
          npm run frontier:drift -- --out reports/frontier-drift/report.json --issue-body-out reports/frontier-drift/issue.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontier-drift
          path: reports/frontier-drift
          if-no-files-found: error
      - name: Open or update drift issue
        if: steps.drift.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Frontier coverage drift requires review"
          issue="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file reports/frontier-drift/issue.md
          else
            gh issue create --title "$title" --body-file reports/frontier-drift/issue.md
          fi
      - name: Fail on drift
        if: steps.drift.outcome == 'failure'
        run: exit 1
